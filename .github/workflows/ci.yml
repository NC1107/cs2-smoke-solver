name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Two pushes landing close together must not race their image publishes: the
# older run finishing last would leave :latest pointing at the older commit,
# which is exactly the audit trail the sha tag exists to provide. Serialize
# rather than cancel - a publish that is already running should finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs, not to floating major tags. A vN tag can
# be repointed by its maintainers - or by whoever compromises the action - and
# the publish job below holds a packages:write token that prod pulls from
# automatically. Update these deliberately; the trailing comment is the version.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Nothing here needs to write anything; say so rather than inheriting
    # whatever the repository default happens to be.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The QueryVersion guard diffs against the commit before this push,
          # which a depth-1 checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # The viewer has no build step and no test runner; this is the check
      # that stands in for both. Each thing it looks for has shipped broken.
      - name: Viewer static check
        run: node --experimental-vm-modules rig/check-viewer.mjs

      # The viewer's copy of HumanError is checked against the C# model's
      # fixture (written by HumanErrorParityTests, committed), plus the pure
      # logic around it.
      - name: Viewer logic check
        run: node --experimental-vm-modules rig/check-viewer-logic.mjs

      - name: Restore
        run: dotnet restore SmokeSolver.sln

      - name: Build
        run: dotnet build SmokeSolver.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Sim.Tests/SmokeSolver.Sim.Tests.csproj -c Release --no-build

      # Cached solve results are keyed on QueryVersion, so a solver change that
      # forgets to bump it keeps serving answers computed by the old code. That
      # has happened seven times (see technical_debt.md A31-H3), each one caught
      # only incidentally by a later unrelated bump.
      #
      # It runs on pushes to master as well as on PRs: almost every change here
      # goes straight to master, and publish-image below ships whatever passes,
      # so a PR-only guard never ran on the pushes it exists to stop. The base
      # is the tip before this push, so a batch of commits is judged as one.
      # A change that genuinely cannot alter an answer says [no-cache-bump] in
      # its commit message.
      - name: Solver changes must bump QueryVersion
        if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[no-cache-bump]')
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "First push of this branch; nothing to compare against."
            exit 0
          fi
          bash rig/check-query-version.sh "$BASE_REF"

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Boot the image itself before anything is pushed. build-and-test runs
      # the code on the bare runner, never in this image, and watchtower
      # deploys :latest within minutes with no rollback, so an image that
      # cannot start (a missing file, a native library, a bad argument) would
      # otherwise go straight to prod. With no map data it serves the viewer
      # and an empty map list, which is enough to prove it boots and answers.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          cache-from: type=gha
          tags: smokesolver-ci:${{ github.sha }}

      - name: The image boots and serves
        run: |
          mkdir -p ci-data
          docker run -d --name smokesolver-ci -p 8137:8137 -v "$PWD/ci-data:/app/data" \
            smokesolver-ci:${{ github.sha }} serve --bind any --attrs Default,default,EntitySolid
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8137/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8137/ || { docker logs smokesolver-ci; exit 1; }
          curl -fsS http://127.0.0.1:8137/api/maps | python3 -c "import json,sys; assert isinstance(json.load(sys.stdin), list)" \
            || { docker logs smokesolver-ci; exit 1; }
          docker rm -f smokesolver-ci

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          # Reuse unchanged layers (base images, NuGet restore) across runs
          # instead of rebuilding the image from scratch every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/nc1107/cs2-smoke-solver:latest
            ghcr.io/nc1107/cs2-smoke-solver:${{ github.sha }}
